[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alyntiq-api"
version = "0.1.0"
description = "Alyntiq API foundation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "lightgbm>=4.5,<5.0",
    "mlflow-skinny>=3.0,<4.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "optuna>=4.0,<6.0",
    "scikit-learn>=1.6,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "torch>=2.7,<2.8",
    "uvicorn[standard]>=0.32,<1.0",
    "xgboost>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]
research = [
    "ipykernel>=6.29,<7.0",
    "matplotlib>=3.9,<4.0",
    "nbconvert>=7.16,<8.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

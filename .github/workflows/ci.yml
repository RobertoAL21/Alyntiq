name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Run backend tests
        run: pytest

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  financial-safety:
    name: Financial safety checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Verify repository safety contracts
        run: python ../scripts/verify_ci_safety.py
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Verify leakage, versioning, paper safety, and backtests
        run: >-
          pytest
          tests/test_ci_safety.py
          tests/test_feature_calculator.py
          tests/test_walk_forward_validation.py
          tests/test_hybrid_strategy.py
          tests/test_alpaca_paper_broker.py
          tests/test_ml_strategy.py
          tests/test_backtest_engine.py
          tests/test_backtest_metrics.py

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag alyntiq-backend:ci backend
      - name: Build frontend image
        run: docker build --tag alyntiq-frontend:ci frontend
